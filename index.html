<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granite / Marble Measurement Digitizer</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--line:#8a8a8a;--head:#dce8f4;--accent:#e8f0dc;--bg:#eef2f5}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef2f5;color:#111}
.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #bbb;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.fileBtn{border:1px solid #777;border-radius:6px;padding:9px 12px;background:#fff;cursor:pointer;font-weight:600}
button.primary{background:#1f5f8b;color:#fff;border-color:#1f5f8b}
button.danger{background:#fff0f0;color:#9b0000}
input[type=text]{border:1px solid #aaa;border-radius:5px;padding:7px}
.fileBtn input{display:none}
#status{font-size:12px;color:#555;margin-left:auto}
.wrap{max-width:1500px;margin:15px auto;padding:0 10px}
.sheet{background:#fff;padding:14px;margin-bottom:20px;box-shadow:0 2px 8px #0002;page-break-after:always}
.title{text-align:center;font-size:20px;font-weight:700;margin:0 0 8px}
.meta{display:grid;grid-template-columns:90px 1fr 70px 1fr;gap:6px;align-items:center;font-size:12px;margin-bottom:8px}
.meta label{font-weight:700}
.meta input{width:100%;border:1px solid #aaa;padding:5px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 105px;gap:8px}
.block{min-width:0}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px}
th,td{border:1px solid var(--line);height:16px;padding:1px 3px;text-align:center;overflow:hidden}
th{background:var(--head);font-weight:700;height:20px}
td[contenteditable=true]{background:#fff;cursor:text}
td[contenteditable=true]:focus{outline:2px solid #5aa0d0;background:#fffde5}
.totalBox{border:1px solid #777;display:flex;flex-direction:column;min-height:100%;background:#fff}
.totalHead{background:var(--accent);border-bottom:1px solid #777;text-align:center;font-weight:700;padding:5px;font-size:10px}
.totalValue{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:text}
.grand{text-align:center;border:1px solid #777;padding:7px;margin-top:8px;font-size:14px;font-weight:700}
.note{font-size:9px;margin-top:7px}
.small{font-size:11px;color:#555}
.progress{width:180px;height:7px;background:#ddd;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}.bar{height:100%;width:0;background:#2f79a8}
@media(max-width:900px){.grid{grid-template-columns:1fr}.totalBox{min-height:80px}.meta{grid-template-columns:70px 1fr 50px 1fr}}
@media print{
 body{background:#fff}.toolbar{display:none}.wrap{margin:0;padding:0}.sheet{box-shadow:none;margin:0;padding:9mm 7mm;height:277mm;overflow:hidden}.sheet:last-child{page-break-after:auto}
 .grid{grid-template-columns:1fr 1fr 1fr 24mm;gap:4mm}table{font-size:7px}th,td{height:4.35mm}th{height:5mm}.title{font-size:15px}.grand{font-size:11px}.note{font-size:7px}
}
</style>
</head>
<body>
<div class="toolbar">
  <label class="fileBtn">📷 Upload photos <input id="photos" type="file" accept="image/*" multiple></label>
  <button class="primary" id="ocrBtn">🔎 Read photos</button>
  <button id="addBtn">➕ Add 50 rows</button>
  <button id="exportPdf">📄 Export PDF</button>
  <button id="printBtn">🖨 Print</button>
  <button id="saveBtn">💾 Save</button>
  <button id="loadBtn">↩ Load saved</button>
  <button class="danger" id="clearBtn">Clear</button>
  <span id="status">Ready</span>
</div>
<div class="wrap">
  <div class="small">Workflow: upload handwritten photos → OCR → correct any cell by clicking it → export a clean 3-page PDF. OCR is only a first pass; handwritten measurements should always be checked.</div>
  <div id="app"></div>
</div>
<script>
const ROWS=450, BLOCK=50, BLOCKS=3, PAGES=3;
let data=Array.from({length:ROWS},(_,i)=>({no:i+1,size:"",sft:""}));
let consignee="", date="";
const $=id=>document.getElementById(id);
function calc(size){
  const m=String(size).trim().replace(/\s+/g,"").match(/^(\\d+(?:\\.\\d+)?)x(\\d+(?:\\.\\d+)?)$/i);
  return m ? (Number(m[1])*Number(m[2])/144).toFixed(2) : "";
}
function total(start,count){
  return data.slice(start,start+count).reduce((s,r)=>s+(Number(r.sft)||0),0);
}
function render(){
  const app=$("app"); app.innerHTML="";
  for(let p=0;p<PAGES;p++){
    const sheet=document.createElement("section"); sheet.className="sheet";
    sheet.innerHTML=`<div class="title">GRANITE / MARBLE MEASUREMENT SHEET</div>
      <div class="meta">
        <label>Consignee :</label><input class="consignee" value="${esc(consignee)}">
        <label>Date :</label><input class="date" value="${esc(date)}">
      </div>
      <div class="grid"></div>
      <div class="grand">GRAND TOTAL SFT OF 450 ENTRIES = <span class="grandVal"></span></div>
      <div class="note"><b>Note:</b> This is a digitized copy. Please verify handwritten/OCR values before final use. SFT = Length × Width ÷ 144.</div>`;
    app.appendChild(sheet);
    const grid=sheet.querySelector(".grid");
    [0,1,2].forEach(b=>{
      const start=p*150+b*50, table=document.createElement("table");
      table.innerHTML="<thead><tr><th style='width:16%'>S.No</th><th style='width:52%'>SIZE</th><th style='width:32%'>SFT</th></tr></thead><tbody></tbody>";
      const tb=table.querySelector("tbody");
      for(let i=0;i<50;i++){
        const idx=start+i,r=data[idx],tr=document.createElement("tr");
        tr.innerHTML=`<td>${r.no}</td><td contenteditable="true" data-idx="${idx}" data-field="size">${esc(r.size)}</td><td contenteditable="true" data-idx="${idx}" data-field="sft">${esc(r.sft)}</td>`;
        tb.appendChild(tr);
      }
      grid.appendChild(table);
    });
    const box=document.createElement("div"); box.className="totalBox";
    box.innerHTML=`<div class="totalHead">TOTAL SFT</div><div class="totalValue" contenteditable="true" data-total-page="${p}">${total(p*150,150).toFixed(3)}</div>`;
    grid.appendChild(box);
    sheet.querySelector(".consignee").oninput=e=>{consignee=e.target.value;};
    sheet.querySelector(".date").oninput=e=>{date=e.target.value;};
    sheet.querySelector(".grandVal").textContent=data.reduce((s,r)=>s+(Number(r.sft)||0),0).toFixed(3);
  }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.addEventListener("input",e=>{
  const c=e.target;
  if(c.matches("[contenteditable][data-idx]")){
    const idx=Number(c.dataset.idx), field=c.dataset.field;
    data[idx][field]=c.innerText.trim();
    if(field==="size"){
      data[idx].sft=calc(data[idx].size);
      const row=c.parentElement;
      const sftCell=row.querySelector('[data-field="sft"]');
      if(sftCell) sftCell.innerText=data[idx].sft;
    }
    updateTotals();
  }
});
function updateTotals(){
  document.querySelectorAll(".totalValue").forEach((el,p)=>{
    el.innerText=total(p*150,150).toFixed(3);
  });
  document.querySelectorAll(".grandVal").forEach(el=>{
    el.innerText=data.reduce((s,r)=>s+(Number(r.sft)||0),0).toFixed(3);
  });
}
$("addBtn").onclick=()=>{const n=data.length; for(let i=0;i<50;i++)data.push({no:n+i+1,size:"",sft:""}); render();};
$("clearBtn").onclick=()=>{if(confirm("Clear all measurements?")){data=Array.from({length:450},(_,i)=>({no:i+1,size:"",sft:""}));render();}};
$("saveBtn").onclick=()=>{localStorage.measurementSheet=JSON.stringify({data,consignee,date});$("status").textContent="Saved in this browser";};
$("loadBtn").onclick=()=>{try{const x=JSON.parse(localStorage.measurementSheet);data=x.data||data;consignee=x.consignee||"";date=x.date||"";render();$("status").textContent="Loaded";}catch(e){alert("No saved sheet found.");}};
$("printBtn").onclick=()=>window.print();

$("photos").onchange=e=>{$("status").textContent=`${e.target.files.length} photo(s) selected`;};
$("ocrBtn").onclick=async()=>{
  const files=[...$("photos").files]; if(!files.length){alert("Upload one or more photos first.");return;}
  $("status").innerHTML='OCR running <span class="progress"><span class="bar" id="bar"></span></span>';
  try{
    const worker=await Tesseract.createWorker("eng");
    await worker.setParameters({tessedit_pageseg_mode:"6"});
    let combined="";
    for(let i=0;i<files.length;i++){
      const res=await worker.recognize(files[i]);
      combined+="\n"+res.data.text;
      $("bar").style.width=((i+1)/files.length*100)+"%";
    }
    await worker.terminate();
    parseOCR(combined);
    render();
    $("status").textContent="OCR complete — review and correct the cells";
  }catch(err){console.error(err);$("status").textContent="OCR failed";alert("OCR failed. You can still enter/edit the table manually.");}
};
function parseOCR(text){
  // Extract dimension-looking tokens such as 89x33, 89 x 33, etc.
  // Serial numbers are assigned sequentially; this avoids trusting OCR serials.
  const matches=[...text.matchAll(/(\\d{2,3})\\s*[xX×]\\s*(\\d{2,3})/g)].map(m=>`${m[1]}x${m[2]}`);
  let j=0;
  for(let i=0;i<data.length && j<matches.length;i++){
    data[i].size=matches[j++];
    data[i].sft=calc(data[i].size);
  }
}
$("exportPdf").onclick=()=>{
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const W=297,H=210, margin=7, gap=3, totalW=23;
  const blockW=(W-2*margin-totalW-3*gap)/3;
  const rowH=3.35, headerH=4.5, top=26;
  for(let page=0;page<3;page++){
    if(page>0) pdf.addPage("a4","landscape");
    pdf.setFont("helvetica","bold"); pdf.setFontSize(13);
    pdf.text("GRANITE / MARBLE MEASUREMENT SHEET",W/2,9,{align:"center"});
    pdf.setFontSize(6); pdf.setFont("helvetica","normal");
    pdf.text("Consignee :",12,15); pdf.line(28,15,78,15);
    pdf.text("Date :",210,15); pdf.line(222,15,275,15);
    pdf.setFontSize(5.5); pdf.text("As per original scan",W/2,15,{align:"center"});
    const starts=[page*150,page*150+50,page*150+100];
    starts.forEach((start,b)=>{
      const x=margin+b*(blockW+gap);
      pdf.setFillColor(220,232,244); pdf.rect(x,top,blockW,headerH,"F");
      pdf.setDrawColor(120); pdf.rect(x,top,blockW,headerH);
      pdf.setFont("helvetica","bold");pdf.setFontSize(6);
      pdf.text("S.No",x+blockW*.08,top+3,{align:"center"});
      pdf.text("SIZE",x+blockW*.46,top+3,{align:"center"});
      pdf.text("SFT",x+blockW*.86,top+3,{align:"center"});
      pdf.setFont("helvetica","normal");pdf.setFontSize(5.3);
      for(let i=0;i<50;i++){
        const y=top+headerH+i*rowH, r=data[start+i];
        pdf.rect(x,y,blockW,rowH);
        pdf.line(x+blockW*.16,y,x+blockW*.16,y+rowH);
        pdf.line(x+blockW*.68,y,x+blockW*.68,y+rowH);
        pdf.text(String(r.no),x+blockW*.08,y+2.35,{align:"center"});
        pdf.text(String(r.size||""),x+blockW*.42,y+2.35,{align:"center"});
        pdf.text(String(r.sft||""),x+blockW*.84,y+2.35,{align:"center"});
      }
    });
    const tx=W-margin-totalW;
    pdf.setFillColor(232,240,220);pdf.rect(tx,top,totalW,headerH,"F");
    pdf.setDrawColor(100);pdf.rect(tx,top,totalW,headerH+50*rowH);
    pdf.setFont("helvetica","bold");pdf.setFontSize(6);pdf.text("TOTAL SFT",tx+totalW/2,top+3,{align:"center"});
    pdf.setFontSize(12);pdf.text(total(page*150,150).toFixed(3),tx+totalW/2,top+headerH+80,{align:"center"});
    pdf.setFontSize(5);pdf.setFont("helvetica","normal");
    pdf.text("Note: Digitized copy; verify handwritten/OCR values.",margin,H-7);
    pdf.setFont("helvetica","bold");pdf.setFontSize(8);
    pdf.text("GRAND TOTAL SFT OF 450 ENTRIES = "+data.reduce((s,r)=>s+(Number(r.sft)||0),0).toFixed(3),W/2,H-5,{align:"center"});
    pdf.setFont("helvetica","normal");pdf.setFontSize(5);
    pdf.text("Page "+(page+1)+" of 3",W-margin,H-7,{align:"right"});
  }
  pdf.save("Granite_Marble_Measurement_Sheet.pdf");
};
render();
</script>
</body>
</html>
