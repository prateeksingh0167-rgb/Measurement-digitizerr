<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Granite / Marble Measurement Digitizer V4</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f5;color:#111}
.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #aaa;padding:10px;display:flex;gap:8px;flex-wrap:wrap}
button,.fileBtn{border:1px solid #777;border-radius:7px;padding:10px 12px;background:#fff;font-weight:700}
.primary{background:#216b99;color:#fff;border-color:#216b99}.danger{background:#fff0f0;color:#900}
.wrap{max-width:1500px;margin:10px auto;padding:0 10px}.status{font-size:14px;color:#555;padding:8px 0}
.preview{display:flex;gap:8px;flex-wrap:wrap;background:#fff;padding:8px}.preview img{width:180px;height:130px;object-fit:contain;border:1px solid #aaa}
.progress{height:8px;background:#ddd;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:#287aa8}
.sheet{background:#fff;padding:14px;margin:14px 0;box-shadow:0 2px 8px #0002;page-break-after:always}
.title{text-align:center;font-size:20px;font-weight:700}.meta{display:grid;grid-template-columns:90px 1fr 70px 1fr;gap:6px;margin:9px 0}.meta input{width:100%;padding:7px;border:1px solid #aaa}
.grid{display:grid;grid-template-columns:repeat(3,1fr) 105px;gap:7px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
th,td{border:1px solid #888;height:19px;text-align:center;padding:2px;overflow:hidden}th{background:#dce8f4}td[contenteditable]{cursor:text}td[contenteditable]:focus{outline:2px solid #58a0d0;background:#fffde5}
.totalBox{border:1px solid #777;display:flex;flex-direction:column}.totalHead{background:#e8f0dc;text-align:center;font-weight:bold;padding:6px}.totalValue{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold}
.grand{text-align:center;border:1px solid #777;padding:7px;margin-top:8px;font-weight:bold}.note{font-size:9px;color:#666;margin-top:7px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:70px 1fr 50px 1fr}.preview img{width:145px;height:105px}}
@media print{.toolbar,.preview,.status{display:none}.sheet{box-shadow:none}.grid{grid-template-columns:repeat(3,1fr) 24mm}}
</style>
</head>
<body>
<div class="toolbar">
<label class="fileBtn">📷 Upload 1–3 photos <input id="photos" type="file" accept="image/*" multiple hidden></label>
<button class="primary" id="read">🔎 Read measurements</button>
<button id="recalc">🧮 Recalculate SFT</button>
<button id="add">➕ Add 50 rows</button>
<button id="pdf">📄 Export PDF</button>
<button id="print">🖨 Print</button>
<button id="save">💾 Save</button>
<button id="load">↩ Load</button>
<button class="danger" id="clear">Clear</button>
</div>
<div class="wrap">
<div class="status" id="status">Ready. Select 1–3 photos.</div>
<div class="preview" id="preview"></div>
<div class="note">V4 uses a low-memory OCR process designed for Android browsers. It processes smaller row bands and continues if one OCR band fails. Handwritten values still need checking.</div>
<div id="app"></div>
</div>
<script>
const $=id=>document.getElementById(id), START=450;
let data=Array.from({length:START},(_,i)=>({no:i+1,size:"",sft:""})),consignee="",date="";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function calc(s){
 s=String(s||"").replace(/[×*]/g,"x").replace(/\s+/g,"");
 const m=s.match(/^(\\d{1,3}(?:\\.\\d+)?)x(\\d{1,3}(?:\\.\\d+)?)$/i);if(!m)return "";
 let a=+m[1],b=+m[2];if(a<10||b<10||a>200||b>200)return "";
 return (a*b/144).toFixed(2);
}
function total(st,n){return data.slice(st,st+n).reduce((a,r)=>a+(+r.sft||0),0)}
function render(){
 const app=$("app");app.innerHTML="";const pages=Math.max(3,Math.ceil(data.length/150));
 for(let p=0;p<pages;p++){
  const sh=document.createElement("section");sh.className="sheet";
  sh.innerHTML=`<div class="title">GRANITE / MARBLE MEASUREMENT SHEET</div>
  <div class="meta"><label>Consignee :</label><input class="con" value="${esc(consignee)}"><label>Date :</label><input class="dat" value="${esc(date)}"></div>
  <div class="grid"></div><div class="grand">GRAND TOTAL SFT = <span class="gv"></span></div>
  <div class="note">SFT = Length × Width ÷ 144. OCR is a first pass; verify all handwritten measurements.</div>`;
  app.appendChild(sh);let g=sh.querySelector(".grid");
  for(let b=0;b<3;b++){let st=p*150+b*50;if(st>=data.length)break;let t=document.createElement("table");
   t.innerHTML="<thead><tr><th style='width:16%'>S.No</th><th style='width:52%'>SIZE</th><th style='width:32%'>SFT</th></tr></thead><tbody></tbody>";
   let tb=t.querySelector("tbody");for(let i=0;i<50&&st+i<data.length;i++){let idx=st+i,r=data[idx],tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.no}</td><td contenteditable data-i="${idx}" data-f="size">${esc(r.size)}</td><td contenteditable data-i="${idx}" data-f="sft">${esc(r.sft)}</td>`;tb.appendChild(tr)}
   g.appendChild(t)}
  let box=document.createElement("div");box.className="totalBox";box.innerHTML=`<div class="totalHead">TOTAL SFT</div><div class="totalValue">${total(p*150,150).toFixed(2)}</div>`;g.appendChild(box);
  sh.querySelector(".con").oninput=e=>consignee=e.target.value;sh.querySelector(".dat").oninput=e=>date=e.target.value;
  sh.querySelector(".gv").textContent=data.reduce((a,r)=>a+(+r.sft||0),0).toFixed(2);
 }
}
function totals(){document.querySelectorAll(".totalValue").forEach((e,p)=>e.textContent=total(p*150,150).toFixed(2));document.querySelectorAll(".gv").forEach(e=>e.textContent=data.reduce((a,r)=>a+(+r.sft||0),0).toFixed(2))}
document.addEventListener("input",e=>{if(!e.target.matches("[data-i]"))return;let i=+e.target.dataset.i,f=e.target.dataset.f;data[i][f]=e.target.innerText.trim();if(f==="size"){data[i].sft=calc(data[i].size);e.target.parentElement.querySelector('[data-f="sft"]').innerText=data[i].sft}totals()});
$("recalc").onclick=()=>{data.forEach(r=>{let x=calc(r.size);if(x)r.sft=x});render();$("status").textContent="SFT recalculated."};
$("add").onclick=()=>{let n=data.length;for(let i=0;i<50;i++)data.push({no:n+i+1,size:"",sft:""});render()};
$("clear").onclick=()=>{if(confirm("Clear all measurements?")){data=Array.from({length:START},(_,i)=>({no:i+1,size:"",sft:""}));render()}};
$("save").onclick=()=>{localStorage.gmdv4=JSON.stringify({data,consignee,date});$("status").textContent="Saved on this device."};
$("load").onclick=()=>{try{let x=JSON.parse(localStorage.gmdv4);data=x.data||data;consignee=x.consignee||"";date=x.date||"";render();$("status").textContent="Loaded."}catch(e){alert("No saved sheet.")}};
$("print").onclick=()=>print();
$("photos").onchange=e=>{let fs=[...e.target.files].slice(0,3);$("preview").innerHTML="";fs.forEach(f=>{let i=document.createElement("img");i.src=URL.createObjectURL(f);$("preview").appendChild(i)});$("status").textContent=fs.length+" photo(s) selected."};

function makeCanvas(file,max=1800){
 return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);let x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);resolve(c)};im.onerror=reject;im.src=URL.createObjectURL(file)});
}
function bandBlob(c,y,h,threshold){
 let bc=document.createElement("canvas");bc.width=c.width;bc.height=h;let x=bc.getContext("2d",{willReadFrequently:true});x.drawImage(c,0,y,c.width,h,0,0,c.width,h);
 if(threshold){let id=x.getImageData(0,0,bc.width,bc.height),d=id.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=g>150?255:0;d[i]=d[i+1]=d[i+2]=g}x.putImageData(id,0,0)}
 return new Promise(res=>bc.toBlob(b=>res(b),"image/jpeg",.9));
}
function dimensions(text){
 text=text.replace(/[Oo]/g,"0").replace(/[Il]/g,"1").replace(/[×*]/g,"x").replace(/[^0-9xX/\\-\\s]/g," ");
 let out=[],re=/(\d{1,3})\s*(?:x|X|\\/|-)\\s*(\d{1,3})/g,m;
 while((m=re.exec(text))){let a=+m[1],b=+m[2];if(a>=10&&b>=10&&a<=200&&b<=200){let v=Math.round(a)+"x"+Math.round(b);if(!out.includes(v))out.push(v)}}
 return out;
}
async function safeRecognize(worker,blob){
 try{let r=await worker.recognize(blob,{tessedit_pageseg_mode:"6"});return r?.data?.text||""}catch(e){console.warn("OCR band failed",e);return ""}
}
async function readOne(file,worker){
 let c=await makeCanvas(file,1800),found=[];
 // Six large horizontal bands are much lighter than dozens of OCR operations.
 let h=Math.ceil(c.height/6);
 for(let i=0;i<6;i++){
  let bh=Math.min(h,c.height-i*h);if(bh<40)continue;
  for(let th of [false,true]){
   let blob=await bandBlob(c,i*h,bh,th),txt=await safeRecognize(worker,blob);
   for(let v of dimensions(txt))if(!found.includes(v))found.push(v);
  }
 }
 // Fallback: one whole-page pass if bands found very little.
 if(found.length<5){let blob=await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.9));let txt=await safeRecognize(worker,blob);for(let v of dimensions(txt))if(!found.includes(v))found.push(v)}
 return found;
}
$("read").onclick=async()=>{
 let files=[...$("photos").files].slice(0,3);if(!files.length){alert("Upload at least one photo.");return}
 $("read").disabled=true;
 try{
  let worker=await Tesseract.createWorker("eng");
  let all=[];
  for(let p=0;p<files.length;p++){
   $("status").innerHTML=`Reading page ${p+1} of ${files.length}…<div class="progress"><div class="bar" id="bar"></div></div>`;
   try{let vals=await readOne(files[p],worker);for(let v of vals)if(!all.includes(v))all.push(v)}catch(e){console.warn(e)}
   let bar=$("bar");if(bar)bar.style.width=((p+1)/files.length*100)+"%";
  }
  await worker.terminate();
  let slots=data.map((r,i)=>r.size?null:i).filter(x=>x!==null);
  all.forEach((v,j)=>{if(slots[j]!==undefined){data[slots[j]].size=v;data[slots[j]].sft=calc(v)}});
  render();
  $("status").textContent=`Finished. ${all.length} measurements detected.`;
 }catch(e){console.error(e);$("status").textContent="OCR could not run on this phone/browser.";alert("OCR could not run. The phone/browser stopped the OCR process. Try one photo at a time, or use Chrome with the page fully loaded.")}
 $("read").disabled=false;
};
$("pdf").onclick=()=>{let {jsPDF}=window.jspdf,pages=Math.ceil(data.length/150),pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),W=297,H=210,m=7,g=3,tw=23,bw=(W-2*m-tw-2*g)/3;
 for(let p=0;p<pages;p++){if(p)pdf.addPage("a4","landscape");pdf.setFont("helvetica","bold");pdf.setFontSize(13);pdf.text("GRANITE / MARBLE MEASUREMENT SHEET",W/2,9,{align:"center"});let starts=[p*150,p*150+50,p*150+100];
 starts.forEach((st,b)=>{if(st>=data.length)return;let x=m+b*(bw+g),top=17,rh=3.25;pdf.setFillColor(220,232,244);pdf.rect(x,top,bw,5,"F");pdf.rect(x,top,bw,5);pdf.setFontSize(6);pdf.text("S.No",x+bw*.08,top+3,{align:"center"});pdf.text("SIZE",x+bw*.45,top+3,{align:"center"});pdf.text("SFT",x+bw*.85,top+3,{align:"center"});pdf.setFont("helvetica","normal");pdf.setFontSize(5);for(let i=0;i<50&&st+i<data.length;i++){let y=top+5+i*rh,r=data[st+i];pdf.rect(x,y,bw,rh);pdf.line(x+bw*.16,y,x+bw*.16,y+rh);pdf.line(x+bw*.68,y,x+bw*.68,y+rh);pdf.text(""+r.no,x+bw*.08,y+2.2,{align:"center"});pdf.text(r.size||"",x+bw*.42,y+2.2,{align:"center"});pdf.text(r.sft||"",x+bw*.84,y+2.2,{align:"center"})}});pdf.setFont("helvetica","bold");pdf.setFontSize(7);pdf.text("GRAND TOTAL SFT = "+data.reduce((a,r)=>a+(+r.sft||0),0).toFixed(2),W/2,H-6,{align:"center"})}pdf.save("Granite_Marble_Measurement_Sheet.pdf")};
render();
</script>
</body>
</html>
